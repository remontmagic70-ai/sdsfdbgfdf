/* «Превращение»: квартира и есть интерфейс. Слева текст и выбор, справа большой план; фон страницы
   «ремонтируется» вместе с этапами, от серого бетона к тёплому льну. Смелость в одном месте: в самой квартире.
   Один светлый вид выбран намеренно: материалы ремонта светлые, тёмная тема убила бы превращение. */
:root{
  --concrete:#D4D2CD;
  --plaster:#E2E0DB;
  --linen:#EFE9DF;
  --paper:#FFFFFF;
  --graphite:#1C1B19;
  --sage:#56654C;

  --ground:var(--concrete);
  --ink:var(--graphite);
  --ink-2:#5B5750;
  --ink-3:#6F6A63;
  --ink-4:#B7B2AA;
  --tint:#F4F1EC;
  --tint-2:#EAE6DF;
  --line:rgba(28,27,25,.09);
  --sage-tint:#E2E8DA;
  --warn:#86561C;--warn-tint:#F6EEE2;--err:#B3261E;
  --st0:#D4D2CD;--st1:#D7D5D0;--st2:#D9D9D6;--st3:#E2E0DB;--st4:#EAE6DE;--st5:#EFE9DF;

  --f-display:'Wix Madefor Display','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-text:'Wix Madefor Text','Segoe UI',system-ui,-apple-system,sans-serif;

  --gut:clamp(16px,4vw,56px);
  --sqk:1;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.3,1.35,.6,1);
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px rgba(28,27,25,.06);
  --shadow-lift:0 2px 4px rgba(28,27,25,.05),0 24px 56px rgba(28,27,25,.11);
  color-scheme:light;
}
@supports (corner-shape:squircle){:root{--sqk:1.7}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

/* ============ сайт ============ */

.tf-b{-webkit-mask-image:linear-gradient(118deg,#000 calc(var(--w,0%) - 6%),transparent calc(var(--w,0%) + 6%));mask-image:linear-gradient(118deg,#000 calc(var(--w,0%) - 6%),transparent calc(var(--w,0%) + 6%))}
.lens-img{-webkit-mask-image:radial-gradient(circle at var(--lx,50%) var(--ly,50%),#000 calc(var(--lr,0px) - 2px),transparent var(--lr,0px));mask-image:radial-gradient(circle at var(--lx,50%) var(--ly,50%),#000 calc(var(--lr,0px) - 2px),transparent var(--lr,0px));will-change:transform}

.lring::before{content:"";position:absolute;left:calc(-1 * var(--lr,0px));top:calc(-1 * var(--lr,0px));width:calc(2 * var(--lr,0px));height:calc(2 * var(--lr,0px));border-radius:50%;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.26),rgba(255,255,255,0) 34%),radial-gradient(circle,rgba(255,255,255,0) 82%,rgba(255,255,255,.12) 94%,rgba(255,255,255,.4) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),inset 0 -16px 30px rgba(28,27,25,.09),0 26px 56px rgba(28,27,25,.2),0 3px 8px rgba(28,27,25,.1)}
.tf-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,transparent calc(var(--w,0%) - 6%),rgba(255,244,222,.34) calc(var(--w,0%) - 1.2%),rgba(255,250,240,.62) var(--w,0%),rgba(255,244,222,.34) calc(var(--w,0%) + 1.2%),transparent calc(var(--w,0%) + 6%));-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mix-blend-mode:screen;opacity:0;transition:opacity .4s}
.tf-sheen.on{opacity:.62}
@property --w{syntax:'<percentage>';inherits:true;initial-value:0%}
.tf-hint{position:relative;flex:none;display:inline-flex;align-items:center;gap:9px;padding:10px 16px 10px 12px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:opacity .4s,transform .4s var(--ease)}

@keyframes pulse{50%{transform:scale(.55);opacity:.5}}

.tf-frames{position:relative;height:100%}
.tf-frame{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);visibility:hidden}
.tf-frame.on,.tf-frame.off{visibility:visible}
.tf-frame:not([data-f="0"]){top:max(0px,calc(50% - 300px));transform:none}
.tf-frame .rv{opacity:0}
.tf-frame.on .rv{animation:rvIn .95s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}

@keyframes rvIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ============ приложение ============ */
.app{position:fixed;inset:0;z-index:50;clip-path:circle(0px at var(--ox,50%) var(--oy,100%));visibility:hidden;transition:clip-path .75s var(--ease-io),visibility 0s .75s;background:var(--st1)}
html.app-open .app{clip-path:circle(150vmax at var(--ox,50%) var(--oy,100%));visibility:visible;transition:clip-path .95s var(--ease-io),visibility 0s}
.app::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:var(--noise,none);background-size:180px 180px;opacity:.05}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--sg,var(--st1));transition:background-color .7s ease}
.screen.enter{animation:scrIn .5s var(--ease) both}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}}
.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.abar{position:relative;z-index:6;flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;min-height:64px}
.abar-mid{text-align:center;min-width:0}
.abar-t{font:600 16px/1.2 var(--f-display);letter-spacing:-.01em}
.abar-s{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar-s span{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top;animation:capin .35s var(--ease) both}
.abar-s .hcap{color:var(--ink);font-weight:500}
.hcap::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage);margin-right:7px;vertical-align:2px}
@keyframes capin{from{opacity:0;transform:translateY(4px)}}
.prog{display:flex;gap:6px;justify-content:center}
.prog i{width:34px;height:4px;border-radius:2px;background:rgba(28,27,25,.12);transition:background .3s}
.prog i.on{background:var(--ink)}

.fdock{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.fdock::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;z-index:-1;background:var(--sg)}
.screen:has(> .fdock) > .scroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 140px),transparent calc(100% - 82px));mask-image:linear-gradient(#000 calc(100% - 140px),transparent calc(100% - 82px))}
.fdock-in{pointer-events:auto;max-width:648px;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.fdock .btn{width:100%}
.fdock .btn-text{height:44px;display:flex;align-items:center;justify-content:center;font:600 14.5px var(--f-display);color:var(--ink-2);width:100%}

.wrap{width:100%;max-width:680px;margin:0 auto;padding:4px 16px 150px;display:flex;flex-direction:column;gap:28px}
.h1{font:600 clamp(28px,3.2vw,40px)/1.08 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.fs{display:flex;flex-direction:column;gap:12px}
.fs-l{font:600 15.5px var(--f-display);padding-left:2px}
.card{--r:24px;background:var(--paper);box-shadow:var(--shadow)}
.list{--r:24px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.hint{font-size:13.5px;line-height:1.5;color:var(--ink-2);padding:0 4px}

.area{padding:20px 20px 16px}
.area-l{display:block;font-size:13.5px;color:var(--ink-2)}
.area-v{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.area-in{font:500 clamp(56px,6vw,72px)/1 var(--f-display);letter-spacing:-.045em;border:0;background:none;padding:0;outline:none;font-variant-numeric:tabular-nums;min-width:1ch;max-width:5ch;field-sizing:content}
.area-u{font:500 26px var(--f-display);color:var(--ink-2)}
.area:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--ink)}
.range{width:100%;margin:14px 0 4px;appearance:none;-webkit-appearance:none;height:30px;background:transparent;cursor:pointer}
.range:focus-visible{outline:none}
.range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--fill),var(--tint-2) var(--fill))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(28,27,25,.25),0 0 0 1px rgba(28,27,25,.05);margin-top:-11px}
.range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--ink)}
.range::-moz-range-track{height:6px;border-radius:3px;background:var(--tint-2)}
.range::-moz-range-progress{height:6px;border-radius:3px;background:var(--ink)}
.range::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(28,27,25,.25)}
.range-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segc{--r:20px;background:var(--paper);padding:15px 15px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:box-shadow .2s}
.segc[aria-checked="true"]{background:var(--ink);color:#fff}
.segc[aria-checked="true"] .segc-d{color:rgba(255,255,255,.66)}
.segc{transition:background-color .25s,color .25s}
.segc-t{font:600 15.5px var(--f-display)}
.segc-d{font-size:13px;line-height:1.35;color:var(--ink-2)}
.sost{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc{--r:22px;background:var(--paper);padding:7px 7px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;text-align:left;transition:box-shadow .2s;min-width:0}
.sc[aria-checked="true"]{background:var(--ink);color:#fff}
.sc[aria-checked="true"] .sc-d{color:rgba(255,255,255,.66)}
.sc{transition:background-color .25s,color .25s}
.sc-img{--r:16px;position:relative;aspect-ratio:1/1;background:var(--tint);overflow:hidden}
.sc-img img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.sc-t{font:600 14.5px/1.2 var(--f-display);padding:0 7px}
.sc-d{font-size:12.5px;line-height:1.35;color:var(--ink-2);padding:0 7px;margin-top:-5px}
.steps{display:grid;grid-template-columns:1fr;gap:0}
.stp{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 14px 14px 18px}
.stp+.stp::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:var(--line)}
.stp-l{font-weight:500}
.stp-h{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.stp-c{display:flex;align-items:center;gap:2px;background:var(--tint);border-radius:999px;padding:4px}
.stp-b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 1px 2px rgba(28,27,25,.12);transition:opacity .2s,transform .12s}
.stp-b:active{transform:scale(.9)}
.stp-b:disabled{opacity:.35;box-shadow:none}
.stp-b .ic{width:18px;height:18px}
.stp-v{min-width:56px;text-align:center;font:600 15.5px var(--f-display);font-variant-numeric:tabular-nums}

/* пакеты в приложении */
.apk{display:grid;grid-template-columns:1fr;gap:10px}
.apc{--r:26px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:stretch;background:var(--paper);padding:8px 16px 8px 8px;box-shadow:var(--shadow);text-align:left;transition:box-shadow .2s;min-width:0}
.apc[aria-checked="true"]{background:var(--ink);color:#fff}
.apc[aria-checked="true"] .apc-d,.apc[aria-checked="true"] .apc-p span{color:rgba(255,255,255,.66)}
.apc[aria-checked="true"] .rdo{background:#fff}
.apc[aria-checked="true"] .rdo::after{background:var(--ink)}
.apc{transition:background-color .25s,color .25s}
.apc-img{--r:18px;background:var(--st5);display:grid;place-items:center;overflow:hidden;min-height:104px;position:relative}
.apc-img img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain}
.apc-b{display:flex;flex-direction:column;gap:5px;padding:8px 0 6px;min-width:0}
.apc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.apc-t{font:600 17px/1.2 var(--f-display);letter-spacing:-.01em}
.apc-d{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.apc-p{margin-top:auto;padding-top:6px;font:600 14.5px var(--f-display);font-variant-numeric:tabular-nums}
.apc-p span{display:block;font:400 12.5px var(--f-text);color:var(--ink-2);margin-bottom:2px}
.rdo{width:24px;height:24px;border-radius:50%;background:var(--tint-2);display:grid;place-items:center;transition:background-color .2s;flex:none}
.rdo::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .25s var(--spring)}
[aria-checked="true"] .rdo{background:var(--ink)}
[aria-checked="true"] .rdo::after{transform:scale(1)}
.cbx{--r:8px;width:24px;height:24px;background:var(--tint-2);display:grid;place-items:center;color:#fff;transition:background-color .2s;flex:none}
.cbx .ic{width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--spring)}
[aria-checked="true"] .cbx{background:var(--ink)}
[aria-checked="true"] .cbx .ic{opacity:1;transform:none}
[aria-disabled="true"] .rdo{background:var(--ink-3)}
[aria-disabled="true"] .rdo::after{transform:scale(1)}

/* план из слоёв */
.plan{position:relative;max-width:100%;flex:none}
.lstack{position:absolute;inset:0;isolation:isolate}
.lstack img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none;transition:filter .25s}
.lstack img.glow{mix-blend-mode:plus-lighter;opacity:.8}
.lstack img.drop{animation:ldrop .75s var(--spring) both}
.lstack img.fadein{animation:lfade .6s ease both}
.lstack img.poof{animation:lpoof .55s var(--ease) both}
.lstack img.flick{animation:lflick 1.2s linear both}
.lstack img.hl{filter:brightness(1.12) saturate(1.08);translate:0 -3px}
.lstack img{transition:filter .25s,translate .3s var(--ease)}
.lstack img.hlb{filter:brightness(1.06)}
@keyframes ldrop{from{opacity:0;transform:translateY(-16px) scale(1.02)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes lfade{from{opacity:0}}
@keyframes lpoof{to{opacity:0;filter:blur(7px);transform:scale(.965)}}
@keyframes lflick{0%{opacity:0}10%{opacity:.55}16%{opacity:.08}28%{opacity:.7}34%{opacity:.3}55%,100%{opacity:.8}}
.wipe{position:absolute;inset:0;z-index:18;-webkit-mask-image:linear-gradient(118deg,#000 40%,transparent 60%);mask-image:linear-gradient(118deg,#000 40%,transparent 60%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:lwipe 1.1s var(--ease-io) both}
@keyframes lwipe{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.spk{position:absolute;width:0;height:0;z-index:60;pointer-events:none}
.spk i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,238,205,.95);animation:spk 1s var(--ease) both;animation-delay:var(--dl,0ms)}
.spk i:nth-child(3n){width:4px;height:4px;left:-2px;top:-2px}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.3)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.thumbp{display:grid;place-items:center;background:var(--st5);padding:4px;overflow:hidden}
.thumbp .plan{height:100%}

/* живая квартира: одна на страницу, переезжает туда, что сейчас на экране */
.v3-park{position:fixed;left:-240px;top:0;width:120px;height:120px;overflow:hidden;pointer-events:none;opacity:0}
.v3{position:relative}
.v3>.v3-ph,.v3>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3>.v3-ph{object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
.v3>.v3-fz{visibility:hidden;pointer-events:none}
.v3[data-st="fz"]>.v3-fz{visibility:visible}
.v3[data-st="fz"]>.v3-ph{visibility:hidden}
.v3>.v3-cv{opacity:0;transition:opacity .5s ease}
.v3[data-st="live"]>.v3-cv{opacity:1}
.v3[data-st="live"]>.v3-ph,.v3[data-st="live"]>.v3-fz{visibility:hidden;transition:visibility 0s .5s}
.v3[data-st="on"]>.v3-cv{opacity:1;transition:none}
.v3[data-st="on"]>.v3-ph,.v3[data-st="on"]>.v3-fz{visibility:hidden}
.lplan>.v3{position:absolute;inset:0;z-index:2}
.lplan.v3live>img,.lplan.v3live>.tf-sheen{visibility:hidden;transition:visibility 0s .5s}
.v3-stage{position:absolute;inset:0;z-index:0}
.v3-cv:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* площадь и комнаты */
.area-note{margin-top:12px;font-size:13.5px;line-height:1.45;color:var(--ink);animation:capin .35s var(--ease) both}
.area-in:disabled{opacity:1;-webkit-text-fill-color:currentColor;color:var(--ink)}
.area.sum:focus-within{box-shadow:var(--shadow)}
.segm{--r:18px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:4px;background:var(--tint-2)}
.segm.rooms{grid-template-columns:minmax(0,1.75fr)}
.segm button{--r:14px;height:44px;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;font:600 15px var(--f-display);color:var(--ink-2);font-variant-numeric:tabular-nums;transition:background-color .2s,color .2s,box-shadow .2s}
@media (hover:hover) and (pointer:fine){.segm button:hover{color:var(--ink)}}
.segm button[aria-checked="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(28,27,25,.1),0 3px 10px rgba(28,27,25,.07)}
.rmc{overflow:hidden}
.tgl{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;width:100%;text-align:left;padding:16px 16px 16px 20px}
.tgl-t{display:block;font:600 15.5px var(--f-display)}
.tgl-d{display:block;font-size:13px;line-height:1.4;color:var(--ink-2);margin-top:3px}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:var(--tint-2);transition:background-color .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(28,27,25,.28);transition:transform .32s var(--spring)}
.tgl[aria-checked="true"] .sw{background:var(--ink)}
.tgl[aria-checked="true"] .sw::after{transform:translateX(20px)}
.rooms{margin:0 16px 0 20px;padding:2px 0 10px;border-top:1px solid var(--line)}
.rm{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;cursor:text}

/* смета: телефон */
.narrow{--hmax:clamp(230px,40vh,360px);--hmin:206px}
.s-params.narrow,.s-pkg.narrow{--hmax:clamp(220px,36vh,330px);--hmin:176px}
.s-form.narrow,.s-sent.narrow,.s-kp.narrow{--hmax:clamp(200px,32vh,300px);--hmin:120px}
.narrow .hero{position:sticky;top:0;z-index:5;height:var(--hmax);margin-bottom:calc(-1 * var(--hmax));display:flex;justify-content:center;align-items:flex-start;padding:0 16px;--r:30px;border-radius:0 0 calc(var(--r) * var(--sqk)) calc(var(--r) * var(--sqk));background:var(--sg);touch-action:pan-y;user-select:none;transition:background-color .7s ease,box-shadow .3s ease}
.narrow .hero.min{box-shadow:0 14px 28px rgba(28,27,25,.10)}
.narrow .hero .v3{flex:none;width:100%;height:calc(var(--hmax) - 30px);transform-origin:50% 0;will-change:transform}
.hero-space{height:var(--hmax)}
.hero-note{position:absolute;right:18px;bottom:9px;font-size:11px;color:var(--ink-3);transition:opacity .25s;pointer-events:none}
.hero.min .hero-note{opacity:0}
.sheet{position:relative;z-index:1;padding-bottom:180px;min-height:100%}
.stages{position:sticky;top:var(--hmin);z-index:4;padding:10px 12px 12px;background:var(--sg);transition:background-color .7s ease}
.stages::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:34px;background:inherit}
.stages::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;background:linear-gradient(var(--sg),transparent);pointer-events:none}
.stages .cap{background:var(--paper);box-shadow:var(--shadow)}
.cap{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px}
.cap button{height:40px;flex:0 0 40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;overflow:hidden;transition:flex-grow .45s var(--ease),flex-basis .45s var(--ease),background-color .25s,color .25s}
.cap .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-display);color:var(--ink-3);background:var(--tint);flex:none;font-variant-numeric:tabular-nums}
.cap .has .dot{background:var(--sage-tint);color:var(--sage)}
.cap .on{flex:1 1 auto;background:var(--ink);color:#fff;padding:0 16px;font:600 14px var(--f-display)}
.cap .on .dot{display:none}
.cap .lbl{display:none}
.cap .on .lbl{display:inline}
.cap .lbl em{font-style:normal;opacity:.55;margin-right:8px;font-variant-numeric:tabular-nums}
.sh{padding:10px 20px 18px}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.sh-of{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sh-sum{--r:999px;display:inline-flex;align-items:center;font:600 13.5px var(--f-display);padding:7px 13px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh-sum.zero{color:var(--ink-2);font-weight:500;font-family:var(--f-text)}
.h-st{font:600 28px/1.08 var(--f-display);letter-spacing:-.025em;margin:8px 0 6px;text-wrap:balance}
.sh-d{font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.groups{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.gsec{font:600 13.5px var(--f-display);color:var(--ink-2);padding:14px 6px 0}
.gsec:first-child{padding-top:2px}
.grp{--r:22px;background:var(--paper);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .3s}
.grp-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px 12px 12px;width:100%;transition:background-color .25s}
@media (hover:hover) and (pointer:fine){.grp-h:hover{background:rgba(28,27,25,.025)}}
.grp.open .grp-h{background:var(--tint)}
.tile{--r:14px;width:44px;height:44px;display:grid;place-items:center;background:var(--tint);color:var(--ink-3);transition:background-color .25s,color .25s}
.tile .ic{width:22px;height:22px}
.grp.act .tile{background:var(--sage-tint);color:var(--sage)}
.grp.open .tile{background:var(--paper)}

.grp-t{display:block;font:600 15.5px/1.25 var(--f-display);letter-spacing:-.005em}
.grp-s{display:block;font-size:13px;line-height:1.3;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grp-p{display:flex;align-items:center;gap:6px;font:600 14.5px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--ink-3);transition:transform .35s var(--ease)}

.opt+.opt::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.opt-t{display:block;font-size:15px;font-weight:500}
.opt-p{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.opt[aria-checked="true"] .opt-t{font-weight:600}
.opt[aria-disabled="true"]{cursor:default}
.qty{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.warn{margin:12px 14px 2px;padding:12px 14px;border-radius:16px;background:var(--warn-tint);color:var(--warn);font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.meas{margin:0 16px 10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 4px}
.mf{--r:16px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--tint)}
.mf.set{background:var(--sage-tint)}
.mf-l{font-size:12.5px;color:var(--ink-2)}
.mf-r{display:flex;align-items:baseline;gap:4px}
.mf input{width:100%;min-width:0;border:0;background:none;padding:0;font:600 17px var(--f-display);font-variant-numeric:tabular-nums;outline:none}

.mf-u{font-size:12.5px;color:var(--ink-2)}
.mf:focus-within{box-shadow:0 0 0 2px var(--ink)}

.after{padding:20px 16px 4px;display:flex;flex-direction:column;gap:4px}
.nexts{--r:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px 15px 20px;background:var(--paper);box-shadow:var(--shadow);width:100%;transition:box-shadow .25s}
@media (hover:hover) and (pointer:fine){.nexts:hover{box-shadow:var(--shadow-lift)}}
.nexts-l{display:block;font-size:12.5px;color:var(--ink-2)}
.nexts-t{display:block;font:600 16px var(--f-display);margin-top:2px}
.nexts .go{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .3s var(--ease)}
@media (hover:hover) and (pointer:fine){.nexts:hover .go{transform:translateX(3px)}}
.btn-text{height:46px;display:flex;align-items:center;justify-content:center;font:600 14.5px var(--f-display);color:var(--ink-2);border-radius:14px;width:100%}
@media (hover:hover) and (pointer:fine){.btn-text:hover{color:var(--ink)}}

/* итог */
.dock{--r:30px;position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper);box-shadow:0 1px 2px rgba(28,27,25,.06),0 18px 50px rgba(28,27,25,.16)}
.s-config.narrow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;z-index:8;pointer-events:none;background:linear-gradient(transparent,var(--sg) 58%)}
.dock .toast{bottom:calc(100% + 10px)}
.tot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:0 2px 0 6px}
.tot-l{display:block;font-size:12.5px;color:var(--ink-2)}
.tot-v{display:block;font:700 23px/1.15 var(--f-display);letter-spacing:-.025em;margin-top:2px}
.tot-c{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:0 1px 2px rgba(28,27,25,.08)}

.bd-open .tot-c .chev{transform:none}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.bd-open .bd{grid-template-rows:1fr}
.bd-i{overflow:hidden;min-height:0;padding:0 6px}
.dock.bd-open .bd-i{overflow-y:auto;overscroll-behavior:contain;max-height:calc(100svh - 290px);scrollbar-width:none}
.bdr{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;padding:6px 0;width:100%;font-size:14px;text-align:left}
.bdr-n{width:24px;height:24px;border-radius:8px;background:rgba(28,27,25,.07);font:600 12px var(--f-display);display:grid;place-items:center;color:var(--ink-2)}
.bdr.cur .bdr-n{background:var(--ink);color:#fff}
.bdr-v{font:600 14px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.bdr-v.none{color:var(--ink-3);font-weight:500}
.bd-m2{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;padding:6px 0;font-size:14px}
.bd-m2:first-of-type{margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.bd-m2 b{font:600 14px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-note{font-size:12.5px;line-height:1.45;color:var(--ink-2);padding-bottom:6px}
.toast{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:14px;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .3s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{font:600 14px var(--f-display);padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff}

@media (min-width:760px){
  .s-config.narrow .sheet{max-width:720px;margin-left:auto;margin-right:auto}
  .s-config.narrow .dock{left:50%;right:auto;width:min(700px,calc(100% - 20px));transform:translateX(-50%)}
}
/* смета: компьютер */
.cw{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(420px,34vw,560px)}
.cw-stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:96px 40px 128px}
.cw-top{position:absolute;left:20px;right:20px;top:16px;z-index:8;display:flex;align-items:center;gap:12px}
.cw-seg{display:flex;gap:4px;padding:5px;border-radius:999px;min-width:0;overflow-x:auto;scrollbar-width:none}
.cw-seg::-webkit-scrollbar{display:none}
.cw-sp{flex:1}
@media (max-width:1599px){.cw-top .pb-t{display:none}.cw-top .pbtn{padding:0 13px}}
.cw-seg button{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font:600 14px var(--f-display);color:var(--ink-2);white-space:nowrap;transition:background-color .25s,color .25s}
@media (hover:hover) and (pointer:fine){.cw-seg button:hover{color:var(--ink);background:rgba(255,255,255,.5)}}

.cw-seg em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.55}

.cw-seg .on .dot{background:#9FB28F}
.cw-seg .dot.off{visibility:hidden}
@media (max-width:1439px){.cw-seg button:not(.on) .lbl{display:none}.cw-seg button{padding:0 14px}}
.snap .grp-b,.snap .chev{transition:none!important}
.opt.flash{animation:flash 1.5s var(--ease) both}
@keyframes flash{0%,30%{background:var(--sage-tint)}100%{background:transparent}}
.lstack.fadein-all{animation:lfade .5s ease both}
.lring{transition:none}
.cw-plan{position:relative;aspect-ratio:var(--par)}

.cw-cap{position:absolute;left:50%;bottom:116px;z-index:6;transform:translate(-50%,8px);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
.cw-cap.on{opacity:1;transform:translate(-50%,0)}

.cw-note{position:absolute;right:24px;top:72px;font-size:12px;color:var(--ink-3);pointer-events:none}
.cw-sum{--r:30px;position:absolute;left:20px;bottom:20px;z-index:7;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;width:min(880px,calc(100% - 40px))}

.cw-bd{--r:28px;position:absolute;left:20px;bottom:98px;z-index:7;width:min(880px,calc(100% - 40px));padding:16px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 40px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}

.cw-panel{--r:34px;position:relative;margin:12px 12px 12px 0;background:var(--paper);box-shadow:0 1px 2px rgba(28,27,25,.05),0 24px 60px rgba(28,27,25,.10);display:flex;flex-direction:column;min-height:0;overflow:hidden}

.cw-panel .grp{box-shadow:none;background:transparent}

.cw-panel .nexts-l{color:rgba(255,255,255,.6)}

.abar.wide{grid-template-columns:auto minmax(0,1fr) auto;padding:16px var(--gut) 0 20px;min-height:0;position:absolute;left:0;top:0;right:0;z-index:8;pointer-events:none}
.abar.wide>*{pointer-events:auto}
.abar-l{display:flex;align-items:center;gap:14px}
.abar-r{display:flex;align-items:center;gap:10px}
.pbtn{--r:16px;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px;background:var(--paper);box-shadow:0 1px 2px rgba(28,27,25,.08),0 4px 14px rgba(28,27,25,.05);font-size:14px;font-weight:500;white-space:nowrap;transition:box-shadow .2s}

/* плитки: образцы отделки и предметы из той же квартиры */
.pic{display:block;flex:none;background-image:url(tl/tiles.webp);background-repeat:no-repeat;background-size:var(--bs);background-position:var(--bp);background-color:var(--paper)}

.pic.none::after{content:"";display:block;width:16px;height:1.5px;margin:21px auto 0;border-radius:1px;background:var(--ink-4);transform:rotate(-45deg)}

/* окно «что входит» */
.modal{position:absolute;inset:0;z-index:30;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(28,27,25,.32);opacity:0;transition:opacity .3s}
.msheet{--r:30px;position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:calc(var(--r) * var(--sqk)) calc(var(--r) * var(--sqk)) 0 0;transform:translateY(102%);transition:transform .45s var(--ease);padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

.m-h{display:flex;align-items:center;gap:14px;margin-top:8px}

.m-st{font-size:13px;color:var(--ink-2)}

  TF.intro=true;TF.introWait=false;var t0=performance.now(),D=4200,io=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};TF.intro3d={t:0};
  (function step(now){if(!TF.intro3d)return;var u=(now-t0)/D;TF.intro3d.t=u<0.4?io(u/0.4):u<0.62?1:u<1?1-io((u-0.62)/0.38):0;V3.scr='';heroScrub();if(u<1)requestAnimationFrame(step);else endIntro();})(t0);}
function heroIntro2d(){var skip=function(){TF.introWait=false;tfUpdate();lensStart();};if(!TF||reduce||!TF.b.animate||tfProgress()>0.02||S.view==='app'){if(TF)skip();return;}var im=new Image();im.src=stImg(5);
  (im.decode?im.decode().catch(function(){}):Promise.resolve()).then(function(){if(tfProgress()>0.02||S.view==='app'){skip();return;}
    TF.intro=true;TF.introWait=false;TF.b.src=stImg(5);TF.sheen.classList.add('on');var E='cubic-bezier(.65,0,.35,1)';
    var kf=[{'--w':'-14%',easing:E},{'--w':'116%',offset:0.36},{'--w':'116%',offset:0.64,easing:E},{'--w':'-14%'}];
    TF.introAn=[TF.b.animate(kf,{duration:3600,fill:'forwards'}),TF.sheen.animate(kf.map(function(f){return Object.assign({},f);}),{duration:3600,fill:'forwards'})];
    TF.introAn[0].onfinish=function(){endIntro();};tfUpdate();});}
function endIntro(){if(!TF)return;TF.introWait=false;TF.introWait3d=false;if(!TF.intro)return;TF.intro=false;TF.intro3d=null;V3.scr='';(TF.introAn||[]).forEach(function(a){try{a.cancel();}catch(e){}});TF.introAn=null;TF.k=-1;tfUpdate();lensStart();}
/* лупа: под курсором та же квартира в другом состоянии; стекло чуть увеличивает */
var LENS=null,FINL=null,FINVIS=0;
function mkLens(o){
  var L={plan:o.plan,img:o.img,ring:o.ring,x:.62,y:.45,tx:.62,ty:.45,r:0,hover:false,used:false,t0:0,raf:0,rx:0,ry:0,until:0};
  var MAG=reduce?1:1.08;
  L.start=function(){if(!L.raf)L.raf=requestAnimationFrame(loop);};
  // лупа гуляет сама 14 секунд, потом останавливается; при «уменьшить движение» стоит на месте
  var IDLE=14,REST={x:.6,y:.47};
  function loop(now){L.raf=0;if(S.view==='app')return;if(!L.t0)L.t0=now;var dt=Math.min(100,now-(L.tl||now))||16.7;L.tl=now;var ke=function(k){return reduce?1:1-Math.pow(1-k,dt/16.7);};
    var R=L.plan.getBoundingClientRect();if(!R.width)return;var F=o.f();
    var t=(now-L.t0)/1000;var idle=!(L.hover||now<L.until);
    if(idle){if(reduce||t>IDLE){L.tx=REST.x;L.ty=REST.y;}else{var u=t+(o.ph||0);L.tx=.5+.27*Math.sin(u*.42)+.05*Math.sin(u*1.7);L.ty=.48+.22*Math.sin(u*.31+1.1);}}
    var tr=R.width*(coarse?0.27:(o.size||0.22))*F;L.r+=(tr-L.r)*ke(0.12);if(Math.abs(L.r-tr)<0.3)L.r=tr;if(L.r<0.5&&tr===0)L.r=0;
    // кольцо целиком внутри плана
    var mx=Math.min(.5,(L.r+6)/R.width),my=Math.min(.5,(L.r+6)/R.height);var cx=clamp(L.tx,mx,1-mx),cy=clamp(L.ty,my,1-my);
    var k=ke(0.13);L.x+=(cx-L.x)*k;L.y+=(cy-L.y)*k;if(Math.abs(cx-L.x)+Math.abs(cy-L.y)<0.0005){L.x=cx;L.y=cy;}
    var lx=L.x*R.width,ly=L.y*R.height;
    L.img.style.transformOrigin=lx.toFixed(1)+'px '+ly.toFixed(1)+'px';L.img.style.transform=MAG>1?'scale('+MAG+')':'';
    L.img.style.setProperty('--lx',lx.toFixed(1)+'px');L.img.style.setProperty('--ly',ly.toFixed(1)+'px');L.img.style.setProperty('--lr',(L.r/MAG).toFixed(1)+'px');
    L.ring.style.transform='translate('+lx.toFixed(1)+'px,'+ly.toFixed(1)+'px)';L.ring.style.setProperty('--lr',L.r.toFixed(1)+'px');L.ring.style.opacity=clamp((L.r-8)/28,0,1).toFixed(3);
    var is3=L.plan.classList.contains('v3live');
    if(V3.view&&V3.spot&&V3.spot.parentNode===L.plan)V3.view.setLens(L.r>0.5?{ids:o.ids3d(),on:true,x:L.x,y:L.y,r:L.r,mag:MAG}:{on:false});
    var tilt=L.hover&&!coarse&&!reduce&&!is3;L.rx+=((tilt?(0.5-L.ty)*5:0)-L.rx)*ke(0.08);L.ry+=((tilt?(L.tx-0.5)*7:0)-L.ry)*ke(0.08);
    var moving=Math.abs(L.rx)+Math.abs(L.ry)>0.01;
    L.plan.style.transform=moving?'perspective(1600px) rotateX('+L.rx.toFixed(2)+'deg) rotateY('+L.ry.toFixed(2)+'deg)':'';
    L.plan.classList.toggle('lensing',F>0.5);
    var settled=Math.abs(cx-L.x)+Math.abs(cy-L.y)<0.0006&&L.r===tr;var wander=idle&&!reduce&&t<=IDLE;
    if((F>0&&(wander||!settled||L.hover))||(F===0&&L.r>0)||moving)L.raf=requestAnimationFrame(loop);}
  function pt(e){var R=L.plan.getBoundingClientRect();return {x:clamp((e.clientX-R.left)/R.width,0.06,0.94),y:clamp((e.clientY-R.top)/R.height,0.06,0.94)};}
  function use(){if(!L.used){L.used=true;if(o.onUse)o.onUse();}}
  L.plan.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var p=pt(e);L.tx=p.x;L.ty=p.y;L.hover=true;use();L.start();});
  L.plan.addEventListener('pointerleave',function(){L.hover=false;L.start();});
  L.start=function(){if(!L.raf){L.tl=0;L.raf=requestAnimationFrame(loop);}};
  L.plan.addEventListener('click',function(e){var p=pt(e);L.tx=p.x;L.ty=p.y;L.until=performance.now()+3200;use();L.start();});
  return L;
}

/* ---------- обновление DOM по ключам ---------- */
function keyOf(n){return n.nodeType===1?n.getAttribute('data-key'):null;}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName||keyOf(a)!==keyOf(b)){a.parentNode.replaceChild(b,a);return;}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  var skip=a.hasAttribute&&a.hasAttribute('data-skip');var i,at;
  if(!skip)for(i=a.attributes.length-1;i>=0;i--){at=a.attributes[i].name;if(!b.hasAttribute(at))a.removeAttribute(at);}
  for(i=0;i<b.attributes.length;i++){at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
  if(a.nodeName==='INPUT'){if(document.activeElement!==a&&a.value!==b.value)a.value=b.value;}
  if(skip)return;
  var bc=Array.prototype.slice.call(b.childNodes);var keyed={};
  Array.prototype.forEach.call(a.childNodes,function(n){var k=keyOf(n);if(k)keyed[k]=n;});
  for(i=0;i<bc.length;i++){
    var nb=bc[i];var k=keyOf(nb);var ref=a.childNodes[i]||null;var na=null;
    if(k){na=keyed[k]||null;}else if(ref&&!keyOf(ref)&&ref.nodeName===nb.nodeName)na=ref;
    if(na){if(na!==ref)a.insertBefore(na,ref);morph(na,nb);}else a.insertBefore(nb,ref);
  }
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}

    copyMat.uniforms.t.value = composer.readBuffer.texture; pass(copyMat, which ? outB : outA);
    if (acc) viewOffset(0, 0);
    ch.n = acc ? k + 1 : 0; ch.has = true;
  }
  const lensLive = () => !!(LENS.on && LENS.st && LENS.r > 0.5);
  function present() {
    const u = lensMat.uniforms; u.tA.value = outA.texture; u.tB.value = outB.texture; u.on.value = lensLive() && CHB.has ? 1 : 0;
    u.c.value.set(LENS.x * PW, (1 - LENS.y) * PH); u.r.value = LENS.r * DPR; u.mag.value = LENS.mag;
    pass(lensMat, null); lensDirty = false;
  }
  function renderB(acc) { LENS.st.items.forEach(id => ensure(id)); for (const fam in LENS.st.fix) fix(fam, LENS.st.fix[fam]); const sn = snap(); applyQuick(LENS.st); shadowDirty = true; renderChain(CHB, 1, acc); unsnap(sn); shadowDirty = true; }
  function frame(now) {
    raf = 0; if (!L) return;
    const cam = stepCam(now);
    let spun = false;
    if (SPIN && !interacting && !camTw && !resetTw) { const dt = Math.min(50, now - (spinT || now)); spinT = now; const off = camera.position.clone().sub(controls.target).applyAxisAngle(UP, SPIN * dt / 1000); camera.position.copy(controls.target).add(off); spun = true; } else spinT = 0;
    const ctl = controls.update(); clampTarget();
    const cut = cutTo(false);
    const anim = stepAnim(now) | stepPending(now);
    const mood = stepMood(Math.min(100, now - (frame.t || now))); frame.t = now;
    if (cut || anim) shadowDirty = true;
    if (cam || ctl || cut || spun) { n = 0; CHB.n = 0; lastA = lastB = now; }
    if (mood) { n = 0; lastA = now; }
    if (anim) { n = 0; lastA = now; }
    const stillA = !interacting && now - lastA > 110, stillB = !interacting && now - lastB > 110, lz = lensLive();
    let drew = false;
    if (!stillA) { renderChain(CHA, 0, false); n = 0; drew = true; }
    else if (n < MAXN) { CHA.n = n; renderChain(CHA, 0, true); n = CHA.n; drew = true; }
    if (lz) { if (!stillB) { renderB(false); drew = true; } else if (CHB.n < MAXN) { renderB(true); drew = true; } }
    if (drew || lensDirty) present();
    if (!stillA || n < MAXN || (lz && (!stillB || CHB.n < MAXN)) || ANIM.size || PENDING.length || camTw || resetTw || SPIN || MOOD.k !== MOOD.to) kick();
    if (opts.onFrame) opts.onFrame({ n, still: stillA, max: MAXN });
  }
  function renderOnce(acc) { CHA.n = acc ? n : 0; renderChain(CHA, 0, acc); if (lensLive()) { CHB.n = acc ? CHB.n : 0; renderB(acc); } present(); }

  // плавный перелёт камеры: к точке, поворот с клавиатуры, возврат
  function flyTo(tgt, offset, dur = 700) { camTw = null; resetTw = { t0: reduce ? -1e9 : performance.now(), start: camera.position.clone(), end: tgt.clone().add(offset), fromT: controls.target.clone(), tgt: tgt.clone(), dur }; kick(); }
  function nudge(dAz, dPol, zoom = 1) {
    const off = camera.position.clone().sub(controls.target), sp = new THREE.Spherical().setFromVector3(off);
    sp.theta += dAz; sp.phi = clamp(sp.phi + dPol, Math.max(0.02, controls.minPolarAngle), controls.maxPolarAngle); sp.radius = clamp(sp.radius * zoom, controls.minDistance, controls.maxDistance);
    flyTo(controls.target.clone(), new THREE.Vector3().setFromSpherical(sp), 380);
  }
  cv.addEventListener('dblclick', e => {
    if (!MODE.zoom) return; const h = pickAt(e.clientX, e.clientY); if (!h) return;
    const tgt = new THREE.Vector3(h.point.x, clamp(h.point.y, 0.3, 0.9), h.point.z);
    const off = camera.position.clone().sub(controls.target); const d = Math.max(controls.minDistance * 1.15, off.length() * 0.42);
    flyTo(tgt, off.normalize().multiplyScalar(d));
  });

  /* ---------- что под курсором ---------- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pickAt(clientX, clientY) {
    if (!root) return null;
    const r = cv.getBoundingClientRect(); ndc.set((clientX - r.left) / r.width * 2 - 1, -(clientY - r.top) / r.height * 2 + 1);
    viewOffset(0, 0); ray.setFromCamera(ndc, camera); const hits = ray.intersectObjects(root.children, true);
    for (const h of hits) { let vis = true; for (let p = h.object; p; p = p.parent) if (!p.visible) { vis = false; break; } if (!vis) continue;
      const o = h.object;
      if (o.userData.wall) { const sl = h.face ? o.userData.wall.slots[h.face.materialIndex] : 'shell'; return sl === 'wm' || sl === 'wb' ? { id: sl + '_' + STATE.fin[sl], point: h.point } : null; }
      const id = o.userData.part || (o.userData.floor ? o.userData.floor + '_' + STATE.fin[o.userData.floor] : null); if (id) return { id, point: h.point }; }
    return null;
  }

  // текстуры и заготовки готовим заранее, пока человек смотрит: потом переключение без рывка
  function warm(ids) {
    const jobs = [];
    ids.forEach(id => { const m = id.match(/^(wm|wb|fm|fb)_(.+)$/); if (m) { if (!FINW[finKey(m[1], m[2])]) jobs.push(() => finW(m[1], m[2])); return; } if (OBJ[id] && !PROC[id] && !id.startsWith('box_') && PROTO[id] === undefined) jobs.push(() => protoOf(id)); });
    const idle = f => (window.requestIdleCallback ? requestIdleCallback(f, { timeout: 500 }) : setTimeout(() => f(null), 40));
    return new Promise(done => {
      const run = dl => { const t0 = performance.now(); do { const j = jobs.shift(); if (j) j(); } while (jobs.length && (dl ? dl.timeRemaining() > 6 : performance.now() - t0 < 10)); if (jobs.length) idle(run); else done(); };
      if (jobs.length) idle(run); else done();
    });
  }

  return {
    setPlan(p, o = {}) { const nl = genLayout(p); const first = !L; const topo = !first && L.sig !== nl.sig; build(nl, topo && !o.instant);
      if (o.keepCam && !first) { camTw = null; const B = bounds(); const d = new THREE.Vector3(B.cx, 0.35, B.cz).sub(controls.target); controls.target.add(d); camera.position.add(d); const dist = fitDist(); controls.minDistance = Math.max(2.2, dist * 0.16); controls.maxDistance = Math.max(controls.maxDistance, dist * 2.2); camera.far = dist * 6 + 40; camera.updateProjectionMatrix(); dirty(); }
      else frameCamera(first, !!o.instant); return nl; },
    setIds(ids, o = {}) { applyIds(ids, o); },
    scrub, setLens, highlight, attach,
    // копия текущего кадра в обычный canvas: место, откуда квартира ушла, не пустеет
    grab(c2, o = {}) { if (!L || CW < 4) return false; const on = LENS.on; if (o.lens === false) LENS.on = false; present(); LENS.on = on; lensDirty = true;
      if (c2.width !== cv.width || c2.height !== cv.height) { c2.width = cv.width; c2.height = cv.height; } const x = c2.getContext('2d'); x.clearRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0); kick(); return true; },
    spin(v) { SPIN = +v || 0; kick(); },
    refit() { if (L) frameCamera(false, false); },
    get converged() { return n >= MAXN; }, get frames() { return n; }, get maxFrames() { return MAXN; },
    get host() { return host; },
    setInsets(v) { Object.assign(INS, v); if (L) frameCamera(false, true); dirty(); },
    warm,
    reset() { if (!L) return; const B = bounds(); const tgt = new THREE.Vector3(B.cx, 0.35, B.cz); flyTo(tgt, homePos(tgt, fitDist()).sub(tgt), 800); },
    nudge,
    pause(v) { paused = !!v; if (!paused) dirty(); },
    // для проверки: k кадров накопления подряд
    still(k = MAXN) { if (!L) return; if (camTw) { camTw.dur = 1; stepCam(performance.now() + 100); } if (resetTw) { resetTw.t0 = -1e9; stepCam(performance.now()); } camTw = null; resetTw = null; controls.update(); ANIM.forEach(g => { g.userData.a0 = -1e9; }); stepAnim(performance.now() + 1e6); stepPending(1e15); cutTo(true); shadowDirty = true; n = 0; CHB.n = 0; for (let i = 0; i < k; i++) { renderOnce(i > 0); n++; } if (opts.onFrame) opts.onFrame({ n, still: true, max: MAXN }); },
    renderNow() { const now = performance.now(); stepCam(now); controls.update(); stepAnim(now); stepPending(now); cutTo(false); shadowDirty = true; n = 0; CHB.n = 0; renderOnce(false); },
    pickAt, renderer, camera, controls, scene,
    get layout() { return L; }, get plan() { return plan; },
    debugPlace(sid, zi) { const s = SLOTS.find(x => x.id === sid), z = L.zones[zi], bb = slotBox(s), blk = blockers(L), out = [];
      for (const A of ORIENTS.map(o => mul2(z.A, o))) { const z2 = Object.assign({}, z, { A }); const m = anchorMatrix(z2, bb), wb = xzBox(bb, m); const t = tryPlace(s, z2, bb, m, blk, L.placed.filter(q => q.id !== sid)); out.push({ A: A.join(','), wb: [wb.x0, wb.x1, wb.z0, wb.z1].map(v => +v.toFixed(2)), bad: t.bad || 'ok' }); }
      return { room: [z.room.x0, z.room.x1, z.room.z0, z.room.z1].map(v => +v.toFixed(2)), blk: blk.filter(b => hit(b, z.room)).map(b => b.k + ':' + [b.x0, b.x1, b.z0, b.z1].map(v => +v.toFixed(2)).join(',')), out }; },
    get dbg() { return { n, interacting, sinceMove: Math.round(performance.now() - lastA), nB: CHB.n, lens: lensLive(), anim: ANIM.size, camTw: !!camTw, resetTw: !!resetTw, cut: Object.assign({}, CUT), paused, raf: !!raf }; },
    dispose() { ro.disconnect(); cancelAnimationFrame(raf); controls.dispose(); renderer.dispose(); cv.remove(); },
  };
}

window.MR3D = { createView, genLayout };
window.dispatchEvent(new Event('mr3d'));
</script>
